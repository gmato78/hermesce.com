<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Voz del Cliente · hermes CE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-zafiro:#2A5686; --brand-zafiro-dark:#102845; --brand-zafiro-light:#4C7AB0;
    --brand-text:#0f2544; --brand-text-soft:#4B5563; --brand-text-mute:#6B7280; --brand-white:#fff;
    --canvas-showroom:#CDDCEC; --font:'Inter',system-ui,sans-serif;
    --radius-lg:28px; --radius-xs:8px;
    --shadow:0 24px 60px -20px rgba(20,40,70,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:var(--font);font-weight:300;color:var(--brand-text);
    background:radial-gradient(120% 120% at 50% 0%, #E2ECF6 0%, var(--canvas-showroom) 55%, #B9CEE4 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}

  /* ── shell de dos columnas (desktop) ─────────────────────────────── */
  /* alto FIJO: todas las pantallas miden igual → el boton no sube/baja */
  .shell{display:flex;width:100%;max-width:900px;height:min(640px,calc(100vh - 56px));
    background:var(--brand-white);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}

  .aside{flex:0 0 40%;background:linear-gradient(155deg,var(--brand-zafiro-dark),var(--brand-zafiro) 70%);
    color:#fff;padding:46px 40px;display:flex;flex-direction:column}
  .aside .brand{font-size:19px;letter-spacing:.5px}
  .aside .brand b{font-weight:300;color:rgba(255,255,255,.92)}
  .aside .brand span{font-weight:700;color:#fff}
  .aside .tagline{margin-top:auto;font-size:clamp(22px,2vw,28px);font-weight:300;line-height:1.28;color:#fff}
  .aside .tagline b{font-weight:600}
  .aside .small{margin-top:16px;font-size:14px;color:rgba(255,255,255,.65)}

  .main{flex:1;min-width:0;padding:44px 52px;display:flex;flex-direction:column;overflow:hidden}
  #body{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto}
  /* pie: boton + linea juntos, pegados al fondo, con gap fijo entre si */
  .foot{margin-top:auto;display:flex;flex-direction:column;padding-top:18px}
  .foot .row{margin:0 0 18px}

  /* ── contenido de preguntas ──────────────────────────────────────── */
  .step{font-size:12px;font-weight:500;color:var(--brand-zafiro-light);letter-spacing:2px;margin-bottom:16px}
  h1{font-size:clamp(28px,3vw,36px);font-weight:300;line-height:1.18;color:var(--brand-zafiro-dark);margin-bottom:14px}
  h1 b{font-weight:700;color:var(--brand-zafiro)}
  .q{font-size:clamp(22px,2.3vw,27px);font-weight:300;line-height:1.32;color:var(--brand-zafiro-dark);margin-bottom:8px}
  .q b{font-weight:600;color:var(--brand-zafiro)}
  p.sub{font-size:17px;color:var(--brand-text-soft);margin-bottom:32px}
  .hint{font-size:13px;color:var(--brand-text-mute);margin-bottom:22px}
  .btn{align-self:flex-start;background:var(--brand-zafiro);color:#fff;border:none;font-family:var(--font);
    font-size:15px;font-weight:500;padding:14px 32px;border-radius:var(--radius-xs);cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(42,86,134,.7);transition:.15s}
  .btn:hover{background:var(--brand-zafiro-dark)}
  .btn.ghost{background:transparent;color:var(--brand-text-mute);box-shadow:none;padding:14px 8px;font-weight:400}
  .row{display:flex;gap:10px;align-items:center;margin-top:4px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:24px}
  .opts .opt:last-child:nth-child(odd){grid-column:1 / -1}
  .opt{display:flex;align-items:center;gap:12px;border:1.5px solid #E3EAF2;border-radius:12px;padding:12px 15px;
    font-size:15px;font-weight:400;color:var(--brand-text);cursor:pointer;transition:.12s}
  .opt:hover{border-color:var(--brand-zafiro-light)}
  .opt .k{width:22px;height:22px;border-radius:6px;border:1.5px solid #CBD7E5;flex:none;position:relative}
  .opt.sel{border-color:var(--brand-zafiro);background:#F2F7FC}
  .opt.sel .k{background:var(--brand-zafiro);border-color:var(--brand-zafiro)}
  .opt.sel .k::after{content:"✓";color:#fff;font-size:13px;position:absolute;top:0;left:4px}
  textarea{width:100%;min-height:130px;border:1.5px solid #E3EAF2;border-radius:12px;padding:14px;
    font-family:var(--font);font-size:15px;font-weight:400;color:var(--brand-text);resize:vertical;margin-bottom:22px}
  textarea:focus{outline:none;border-color:var(--brand-zafiro)}
  .scale{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .num{width:42px;height:46px;border:1.5px solid #E3EAF2;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:500;color:var(--brand-text-soft);cursor:pointer;transition:.12s}
  .num:hover{border-color:var(--brand-zafiro-light)}
  .num.on{background:var(--brand-zafiro);color:#fff;border-color:var(--brand-zafiro);transform:translateY(-3px);
    box-shadow:0 8px 16px -6px rgba(42,86,134,.6)}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--brand-text-mute)}
  .pg{height:4px;background:#E9EFF6;border-radius:3px;overflow:hidden}
  .pg i{display:block;height:100%;background:var(--brand-zafiro);transition:width .3s}
  .center{justify-content:center}
  .center h1{margin-bottom:14px}
  .muted{color:var(--brand-text-mute);font-size:16px}

  /* ── mobile: una columna, pantalla completa ──────────────────────── */
  @media (max-width:720px){
    body{padding:0;align-items:stretch}
    .shell{flex-direction:column;max-width:none;height:auto;min-height:100vh;border-radius:0;box-shadow:none}
    .aside{flex:none;flex-direction:row;align-items:center;padding:18px 22px;gap:10px}
    .aside .tagline,.aside .small{display:none}
    .main{padding:32px 24px}
    .btn{padding:14px 28px}
    .opts{grid-template-columns:1fr}
  }
  @media (max-width:380px){ .num{width:38px;height:42px} }
</style>
</head>
<body>
<div class="shell">
  <aside class="aside">
    <div class="brand"><b>hermes</b> <span>CE</span></div>
    <div class="tagline">Comercio Exterior.<br><b>Fácil y Simple.</b></div>
    <div class="small">Tu opinión · 3 minutos</div>
  </aside>
  <main class="main">
    <div id="body" class="center"><p class="muted">Cargando…</p></div>
  </main>
</div>

<script>
const API = new URLSearchParams(location.search).get('api') ?? 'https://api.hermesce.com';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const ASPECTOS = ["El cuidado en los detalles","Los tiempos de respuesta","El criterio y la experiencia",
  "El trato cercano","Ver los problemas antes de que pasen","La confidencialidad","Otro"];

const data = {token: TOKEN, aspectos: [], palabras: "", nps: null, mejora: "", caso: "", que_paso: "", algo_mas: ""};
let invitado = null;
const body = document.getElementById('body');

function el(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for(const k in props){ if(k==='class') e.className=props[k]; else if(k==='text') e.textContent=props[k]; else e[k]=props[k]; }
  kids.forEach(c=>e.append(c)); return e;
}
function toTop(){ try{window.scrollTo(0,0);}catch(e){} body.scrollTop=0; }
function clear(){ body.className=''; body.innerHTML=''; toTop(); }
function progress(pct){ const w=el('div',{class:'pg'}); const i=el('i',{}); i.style.width=pct+'%'; w.append(i); return w; }
// pie: agrupa botones + barra de progreso, pegado al fondo, gap fijo entre si
function foot(pct, ...btns){
  const f=el('div',{class:'foot'});
  if(btns.length){ const r=el('div',{class:'row'}); btns.forEach(b=>r.append(b)); f.append(r); }
  f.append(progress(pct)); return f;
}
function escapeName(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function screenMsg(titHtml, subText){
  clear(); body.className='center';
  const h=el('h1'); h.innerHTML=titHtml; body.append(h);
  if(subText) body.append(el('p',{class:'muted',text:subText}));
}

const STEPS = ['welcome','aspectos','palabras','nps','mejora','rama','algo_mas'];
let idx = 0;
function next(){ idx++; render(); }
function render(){
  const name = STEPS[idx];
  ({welcome, aspectos:qAspectos, palabras:qPalabras, nps:qNps, mejora:qMejora, rama:qRama, algo_mas:qAlgoMas})[name]();
}

function welcome(){
  clear(); body.className='center';
  const h=el('h1'); h.innerHTML = 'Hola, ' + escapeName(invitado.nombre) + '.<br><b>Tu mirada nos sirve.</b>';
  body.append(h);
  body.append(el('p',{class:'sub',text:'3 minutos, sin vueltas. Gracias por el tiempo.'}));
  const b=el('button',{class:'btn',text:'Empezar  →'}); b.onclick=next; body.append(b);
}
function header(stepNo){ body.append(el('div',{class:'step',text:('0'+stepNo)+' — DE 05'})); }

function qAspectos(){
  clear(); header(1);
  const q=el('div',{class:'q'}); q.innerHTML='De trabajar con nosotros, ¿qué es lo que más <b>valorás</b>?'; body.append(q);
  body.append(el('div',{class:'hint',text:'Elegí lo que pese más.'}));
  const box=el('div',{class:'opts'});
  ASPECTOS.forEach(a=>{
    const o=el('div',{class:'opt'}); o.append(el('span',{class:'k'}), el('span',{text:a}));
    o.onclick=()=>{ o.classList.toggle('sel');
      data.aspectos=[...box.querySelectorAll('.opt.sel span:last-child')].map(s=>s.textContent); };
    box.append(o);
  });
  body.append(box);
  const b=el('button',{class:'btn',text:'Seguir  →'}); b.onclick=next;
  body.append(foot(20, b));
}
function qPalabras(){
  clear(); header(2);
  const q=el('div',{class:'q'}); q.textContent='¿Querés contarlo en tus palabras?'; body.append(q);
  body.append(el('div',{class:'hint',text:'Opcional.'}));
  const t=el('textarea',{value:data.palabras}); body.append(t);
  const b=el('button',{class:'btn',text:'Seguir  →'}); b.onclick=()=>{data.palabras=t.value;next();};
  const s=el('button',{class:'btn ghost',text:'Saltar'}); s.onclick=next;
  body.append(foot(40, b, s));
}
function qNps(){
  clear(); header(3);
  const q=el('div',{class:'q'}); q.innerHTML='Y pensándolo en general, ¿qué tan probable es que nos <b>recomiendes</b> a un colega del rubro?'; body.append(q);
  const sc=el('div',{class:'scale'});
  for(let i=0;i<=10;i++){ const n=el('div',{class:'num',text:String(i)});
    n.onclick=()=>{ sc.querySelectorAll('.num').forEach(x=>x.classList.remove('on')); n.classList.add('on'); data.nps=i; setTimeout(next,260); };
    sc.append(n); }
  body.append(sc);
  const e=el('div',{class:'ends'}); e.append(el('span',{text:'Nada probable'}),el('span',{text:'Totalmente'})); body.append(e);
  body.append(foot(60));
}
function qMejora(){
  clear(); header(4);
  const q=el('div',{class:'q'}); q.textContent='¿Qué podríamos hacer mejor?'; body.append(q);
  const t=el('textarea',{value:data.mejora}); body.append(t);
  const b=el('button',{class:'btn',text:'Seguir  →'}); b.onclick=()=>{data.mejora=t.value;next();};
  const s=el('button',{class:'btn ghost',text:'Saltar'}); s.onclick=next;
  body.append(foot(80, b, s));
}
function qRama(){
  clear(); header(5);
  const contento = data.nps>=7;
  const q=el('div',{class:'q'});
  if(contento) q.innerHTML='¿Recordás algún caso especial donde sentiste nuestro <b>esfuerzo extra</b>? Contámelo.';
  else q.textContent='Contanos qué pasó. Nos importa resolverlo.';
  body.append(q);
  if(contento) body.append(el('div',{class:'hint',text:'Un despacho trabado, una urgencia, algo que otro no te resolvía…'}));
  const t=el('textarea',{}); body.append(t);
  const b=el('button',{class:'btn',text:'Seguir  →'});
  b.onclick=()=>{ if(contento) data.caso=t.value; else data.que_paso=t.value; next(); };
  body.append(foot(90, b));
}
function qAlgoMas(){
  clear(); header(5);
  const q=el('div',{class:'q'}); q.textContent='¿Algo más que quieras decirnos?'; body.append(q);
  body.append(el('div',{class:'hint',text:'Opcional.'}));
  const t=el('textarea',{}); body.append(t);
  const b=el('button',{class:'btn',text:'Enviar  →'}); b.onclick=()=>{data.algo_mas=t.value;submit();};
  const s=el('button',{class:'btn ghost',text:'Enviar sin agregar'}); s.onclick=submit;
  body.append(foot(100, b, s));
}

async function submit(){
  screenMsg('Enviando…','');
  const campos = {token:data.token, nps:data.nps, aspectos:data.aspectos,
    palabras:data.palabras, mejora:data.mejora, caso:data.caso, que_paso:data.que_paso, algo_mas:data.algo_mas};
  try{
    const res = await fetch(API+'/api/voz', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({campos, lang:'es'})});
    const j = await res.json();
    if(j.ok){
      if(data.nps>=7) screenMsg('Gracias, en serio.','Esto nos ordena.');
      else screenMsg('Gracias por la franqueza.','La tenemos muy en cuenta.');
    } else { screenMsg('Hubo un problema.','Probá de nuevo en un rato.'); }
  }catch(e){ screenMsg('Hubo un problema.','Probá de nuevo en un rato.'); }
}

async function start(){
  if(!TOKEN){ return screenMsg('Link inválido.','Pedí el enlace nuevamente.'); }
  try{
    const res = await fetch(API+'/api/voz/'+encodeURIComponent(TOKEN));
    if(res.status===404){ return screenMsg('Link inválido o vencido.','Pedí el enlace nuevamente.'); }
    invitado = await res.json();
    if(invitado.respondido){ return screenMsg('Ya respondiste.','Gracias por tu tiempo.'); }
    render();
  }catch(e){ screenMsg('No se pudo cargar.','Probá de nuevo en un rato.'); }
}
start();
</script>
</body>
</html>
